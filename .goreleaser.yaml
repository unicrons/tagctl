version: 2

project_name: tagctl

builds:
  - main: ./cmd/tagctl
    binary: tagctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/unicrons/tagctl/internal/cli.Version={{ .Version }}
      - -X github.com/unicrons/tagctl/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/unicrons/tagctl/internal/cli.Date={{ .Date }}

archives:
  # No version in the name, so releases/latest/download/<name> stays a stable URL.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - tagctl.yaml.example

checksum:
  name_template: checksums.txt

dockers_v2:
  - images:
      - ghcr.io/unicrons/tagctl
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Audit, fix and enforce cloud resource tags
      org.opencontainers.image.source: https://github.com/unicrons/tagctl
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    annotations:
      org.opencontainers.image.description: Audit, fix and enforce cloud resource tags
      org.opencontainers.image.source: https://github.com/unicrons/tagctl
      org.opencontainers.image.licenses: Apache-2.0

changelog:
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^chore\(merge\)'
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]+\))?!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([^)]+\))?!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([^)]+\))?!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([^)]+\))?!?:.+$'
      order: 3
    - title: Dependencies
      regexp: '^.*?deps(\([^)]+\))?!?:.+$'
      order: 4
    - title: Other changes
      order: 999

release:
  prerelease: auto
