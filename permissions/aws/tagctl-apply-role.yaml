AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  tagctl remediation role. Everything the scan role can do, plus writing tags on the supported resource types, each action scoped to the ARNs tagctl tags. Assume it only to run tagctl apply.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Who can assume the role
        Parameters:
          - TrustedPrincipalArn
          - ExternalId
          - RequireMFA
          - OrgId
      - Label:
          default: Role settings
        Parameters:
          - RoleName
          - MaxSessionDuration
          - PermissionsBoundaryArn
      - Label:
          default: What the role may tag
        Parameters:
          - AllowCodeBuildTagging
          - ProtectedTagKeys

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: >-
      Principal allowed to assume the role: an account root
      (arn:aws:iam::111111111111:root), an IAM role or user, or an Identity
      Center permission-set role. Use the account root to trust the whole
      account and let IAM policies there decide who assumes it.
    AllowedPattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:.+$"
    ConstraintDescription: must be an IAM principal ARN
  ExternalId:
    Type: String
    Description: >-
      Optional. When set, callers must send it as sts:ExternalId; put the same
      value in external_id in tagctl.yaml. Recommended when the principal lives
      in another account.
    Default: ""
    NoEcho: true
  RequireMFA:
    Type: String
    Description: >-
      Require an MFA-authenticated session to assume the role. Set to true for
      roles assumed by people; keep false for CI, where no MFA context exists.
    Default: "true"
    AllowedValues: ["true", "false"]
  OrgId:
    Type: String
    Description: >-
      Optional. AWS Organizations id. When set, the caller must also belong to
      this organization (aws:PrincipalOrgID), on top of matching
      TrustedPrincipalArn.
    Default: ""
    AllowedPattern: "^(o-[a-z0-9]{10,32})?$"
    ConstraintDescription: must be empty or an organization id such as o-a1b2c3d4e5
  RoleName:
    Type: String
    Description: Name of the role. Referenced from tagctl.yaml as role_arn.
    Default: TagctlApply
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"
  MaxSessionDuration:
    Type: Number
    Description: >-
      Upper bound, in seconds, for session_duration in tagctl.yaml. A full
      scan of a large account can run past one hour.
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
  PermissionsBoundaryArn:
    Type: String
    Description: Optional permissions boundary to attach to the role.
    Default: ""
  AllowCodeBuildTagging:
    Type: String
    Description: >-
      Grant codebuild:UpdateProject. CodeBuild has no tag-only action, and this
      one can also replace a project's buildspec and service role, so it is off
      by default and tagctl apply reports CodeBuild changes as failed.
    Default: "false"
    AllowedValues: ["true", "false"]
  ProtectedTagKeys:
    Type: String
    Description: >-
      Optional. Comma-separated tag keys, wildcards allowed and no spaces
      around the commas, that the role may never add, change or remove, such as
      the keys your ABAC policies check. Adds a Deny on aws:TagKeys.
    Default: ""

Conditions:
  HasExternalId:
    Fn::Not:
      - Fn::Equals: [{Ref: ExternalId}, ""]
  MFARequired:
    Fn::Equals: [{Ref: RequireMFA}, "true"]
  HasOrgId:
    Fn::Not:
      - Fn::Equals: [{Ref: OrgId}, ""]
  HasTrustConditions:
    Fn::Or: [{Condition: HasExternalId}, {Condition: MFARequired}, {Condition: HasOrgId}]
  HasPermissionsBoundary:
    Fn::Not:
      - Fn::Equals: [{Ref: PermissionsBoundaryArn}, ""]
  CodeBuildTagging:
    Fn::Equals: [{Ref: AllowCodeBuildTagging}, "true"]
  HasProtectedTagKeys:
    Fn::Not:
      - Fn::Equals: [{Ref: ProtectedTagKeys}, ""]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: {Ref: RoleName}
      Description: Read-write role for tagctl apply
      MaxSessionDuration: {Ref: MaxSessionDuration}
      PermissionsBoundary:
        Fn::If:
          - HasPermissionsBoundary
          - {Ref: PermissionsBoundaryArn}
          - {Ref: AWS::NoValue}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TagctlAssumeRole
            Effect: Allow
            Principal:
              AWS: {Ref: TrustedPrincipalArn}
            Action: sts:AssumeRole
            Condition:
              Fn::If:
                - HasTrustConditions
                - StringEquals:
                    Fn::If:
                      - HasExternalId
                      - Fn::If:
                          - HasOrgId
                          - sts:ExternalId: {Ref: ExternalId}
                            aws:PrincipalOrgID: {Ref: OrgId}
                          - sts:ExternalId: {Ref: ExternalId}
                      - Fn::If:
                          - HasOrgId
                          - aws:PrincipalOrgID: {Ref: OrgId}
                          - {Ref: AWS::NoValue}
                  Bool:
                    Fn::If:
                      - MFARequired
                      - aws:MultiFactorAuthPresent: "true"
                      - {Ref: AWS::NoValue}
                - {Ref: AWS::NoValue}
      Tags:
        - Key: managed-by
          Value: tagctl
      Policies:
        - PolicyName: TagctlScan
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BulkTags
                Effect: Allow
                Action:
                  - tag:GetResources
                Resource: "*"
              - Sid: Discovery
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - ec2:DescribeRegions
                  - ec2:DescribeInstances
                  - ec2:DescribeImages
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNatGateways
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeAddresses
                  - autoscaling:DescribeAutoScalingGroups
                  - lambda:ListFunctions
                  - ecs:ListClusters
                  - ecs:DescribeClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - ecr:DescribeRepositories
                  - elasticbeanstalk:DescribeEnvironments
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTags
                  - globalaccelerator:ListTagsForResource
                  - apigateway:GET
                  - route53:ListHostedZones
                  - cloudfront:ListDistributions
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - elasticfilesystem:DescribeFileSystems
                  - fsx:DescribeFileSystems
                  - backup:ListBackupVaults
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                  - rds:DescribeDBSnapshots
                  - dynamodb:ListTables
                  - elasticache:DescribeCacheClusters
                  - redshift:DescribeClusters
                  - es:ListDomainNames
                  - es:DescribeDomains
                  - kinesis:ListStreams
                  - firehose:ListDeliveryStreams
                  - kafka:ListClustersV2
                  - glue:GetJobs
                  - sagemaker:ListEndpoints
                  - sagemaker:ListNotebookInstances
                  - sns:ListTopics
                  - sqs:ListQueues
                  - sqs:GetQueueAttributes
                  - events:ListRules
                  - states:ListStateMachines
                  - cognito-idp:ListUserPools
                  - logs:DescribeLogGroups
                  - cloudwatch:DescribeAlarms
                  - cloudformation:DescribeStacks
                  - codebuild:ListProjects
                  - secretsmanager:ListSecrets
                  - acm:ListCertificates
                  - kms:ListKeys
                  - kms:DescribeKey
                  - iam:ListRoles
                  - access-analyzer:ListAnalyzers
                  - acm-pca:ListCertificateAuthorities
                  - cloudtrail:DescribeTrails
                  - config:DescribeConfigRules
                  - ds:DescribeDirectories
                  - fms:ListPolicies
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - network-firewall:ListFirewalls
                  - rolesanywhere:ListTrustAnchors
                  - waf-regional:ListWebACLs
                  - waf:ListWebACLs
                  - wafv2:ListWebACLs
                  - shield:ListProtections
                  - globalaccelerator:ListAccelerators
                  - amplify:ListApps
                  - appsync:ListGraphqlApis
                  - bedrock:ListGuardrails
                  - codeartifact:ListDomains
                  - codeartifact:ListRepositories
                  - codecommit:ListRepositories
                  - codepipeline:ListPipelines
                  - servicecatalog:ListPortfolios
                  - wellarchitected:ListWorkloads
                  - athena:ListWorkGroups
                  - dms:DescribeReplicationInstances
                  - datapipeline:ListPipelines
                  - datapipeline:DescribePipelines
                  - datasync:ListTasks
                  - elasticmapreduce:ListClusters
                  - glacier:ListVaults
                  - memorydb:DescribeClusters
                  - mq:ListBrokers
                  - ses:ListEmailIdentities
                  - ses:ListConfigurationSets
                  - storagegateway:ListGateways
                  - transfer:ListServers
                  - appstream:DescribeFleets
                  - appstream:DescribeStacks
                  - batch:DescribeComputeEnvironments
                  - batch:DescribeJobQueues
                  - directconnect:DescribeConnections
                  - dlm:GetLifecyclePolicies
                  - drs:DescribeSourceServers
                  - lightsail:GetInstances
                  - lightsail:GetRegions
                  - ssm:DescribeParameters
                  - ssm:ListDocuments
                  - ssm-incidents:ListResponsePlans
                  - workspaces:DescribeWorkspaces
                  - ce:GetCostAndUsage
                Resource: "*"
              - Sid: PerResourceTagFallback
                Effect: Allow
                Action:
                  - s3:GetBucketTagging
                  - rds:ListTagsForResource
                  - lambda:ListTags
                  - sns:ListTagsForResource
                  - sqs:ListQueueTags
                  - dynamodb:ListTagsOfResource
                  - elasticache:ListTagsForResource
                  - ecr:ListTagsForResource
                  - kms:ListResourceTags
                  - kinesis:ListTagsForStream
                  - logs:ListTagsForResource
                  - cloudtrail:ListTags
                Resource: "*"
        - PolicyName: TagctlApply
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ServiceTagAPIs
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - s3:PutBucketTagging
                  - rds:AddTagsToResource
                  - lambda:TagResource
                  - sns:TagResource
                  - sqs:TagQueue
                  - elasticloadbalancing:AddTags
                  - autoscaling:CreateOrUpdateTags
                  - dynamodb:TagResource
                  - ecs:TagResource
                  - eks:TagResource
                  - elasticache:AddTagsToResource
                  - elasticfilesystem:TagResource
                  - ecr:TagResource
                  - kms:TagResource
                  - kinesis:AddTagsToStream
                  - logs:TagResource
                  - lightsail:TagResource
                  - globalaccelerator:TagResource
                Resource:
                  - "arn:aws:ec2:*:*:instance/*"
                  - "arn:aws:ec2:*::image/*"
                  - "arn:aws:ec2:*:*:volume/*"
                  - "arn:aws:ec2:*::snapshot/*"
                  - "arn:aws:ec2:*:*:launch-template/*"
                  - "arn:aws:ec2:*:*:security-group/*"
                  - "arn:aws:ec2:*:*:vpc/*"
                  - "arn:aws:ec2:*:*:subnet/*"
                  - "arn:aws:ec2:*:*:internet-gateway/*"
                  - "arn:aws:ec2:*:*:natgateway/*"
                  - "arn:aws:ec2:*:*:vpc-endpoint/*"
                  - "arn:aws:ec2:*:*:elastic-ip/*"
                  - "arn:aws:s3:::*"
                  - "arn:aws:rds:*:*:db:*"
                  - "arn:aws:rds:*:*:cluster:*"
                  - "arn:aws:rds:*:*:snapshot:*"
                  - "arn:aws:lambda:*:*:function:*"
                  - "arn:aws:sns:*:*:*"
                  - "arn:aws:sqs:*:*:*"
                  - "arn:aws:elasticloadbalancing:*:*:loadbalancer/*"
                  - "arn:aws:elasticloadbalancing:*:*:targetgroup/*"
                  - "arn:aws:autoscaling:*:*:autoScalingGroup:*:autoScalingGroupName/*"
                  - "arn:aws:dynamodb:*:*:table/*"
                  - "arn:aws:ecs:*:*:cluster/*"
                  - "arn:aws:ecs:*:*:service/*"
                  - "arn:aws:eks:*:*:cluster/*"
                  - "arn:aws:elasticache:*:*:cluster:*"
                  - "arn:aws:elasticfilesystem:*:*:file-system/*"
                  - "arn:aws:ecr:*:*:repository/*"
                  - "arn:aws:kms:*:*:key/*"
                  - "arn:aws:kinesis:*:*:stream/*"
                  - "arn:aws:logs:*:*:log-group:*"
                  - "arn:aws:lightsail:*:*:Instance/*"
                  - "arn:aws:globalaccelerator::*:accelerator/*"
              - Sid: TaggingAPI
                Effect: Allow
                Action:
                  - tag:TagResources
                  - workspaces:CreateTags
                Resource: "*"
              - Sid: TaggingAPIServices
                Effect: Allow
                Action:
                  - elasticbeanstalk:AddTags
                  - apigateway:PUT
                  - apigateway:POST
                  - route53:ChangeTagsForResource
                  - cloudfront:TagResource
                  - fsx:TagResource
                  - backup:TagResource
                  - redshift:CreateTags
                  - es:AddTags
                  - firehose:TagDeliveryStream
                  - kafka:TagResource
                  - glue:TagResource
                  - sagemaker:AddTags
                  - events:TagResource
                  - states:TagResource
                  - cognito-idp:TagResource
                  - cloudwatch:TagResource
                  - cloudformation:TagResource
                  - secretsmanager:TagResource
                  - acm:AddTagsToCertificate
                  - iam:TagRole
                  - access-analyzer:TagResource
                  - acm-pca:TagCertificateAuthority
                  - cloudtrail:AddTags
                  - config:TagResource
                  - ds:AddTagsToResource
                  - fms:TagResource
                  - guardduty:TagResource
                  - network-firewall:TagResource
                  - rolesanywhere:TagResource
                  - waf-regional:TagResource
                  - waf:TagResource
                  - wafv2:TagResource
                  - shield:TagResource
                  - amplify:TagResource
                  - appsync:TagResource
                  - bedrock:TagResource
                  - codeartifact:TagResource
                  - codecommit:TagResource
                  - codepipeline:TagResource
                  - wellarchitected:TagResource
                  - athena:TagResource
                  - dms:AddTagsToResource
                  - datapipeline:AddTags
                  - datasync:TagResource
                  - elasticmapreduce:AddTags
                  - glacier:AddTagsToVault
                  - memorydb:TagResource
                  - mq:CreateTags
                  - ses:TagResource
                  - storagegateway:AddTagsToResource
                  - transfer:TagResource
                  - appstream:TagResource
                  - batch:TagResource
                  - directconnect:TagResource
                  - dlm:TagResource
                  - drs:TagResource
                  - ssm:AddTagsToResource
                  - ssm-incidents:TagResource
                Resource:
                  - "arn:aws:elasticbeanstalk:*:*:environment/*"
                  - "arn:aws:apigateway:*::/tags/*"
                  - "arn:aws:route53:::hostedzone/*"
                  - "arn:aws:cloudfront::*:distribution/*"
                  - "arn:aws:fsx:*:*:file-system/*"
                  - "arn:aws:backup:*:*:backup-vault:*"
                  - "arn:aws:redshift:*:*:cluster:*"
                  - "arn:aws:es:*:*:domain/*"
                  - "arn:aws:firehose:*:*:deliverystream/*"
                  - "arn:aws:kafka:*:*:cluster/*"
                  - "arn:aws:glue:*:*:job/*"
                  - "arn:aws:sagemaker:*:*:endpoint/*"
                  - "arn:aws:sagemaker:*:*:notebook-instance/*"
                  - "arn:aws:events:*:*:rule/*"
                  - "arn:aws:states:*:*:stateMachine:*"
                  - "arn:aws:cognito-idp:*:*:userpool/*"
                  - "arn:aws:cloudwatch:*:*:alarm:*"
                  - "arn:aws:cloudformation:*:*:stack/*"
                  - "arn:aws:secretsmanager:*:*:secret:*"
                  - "arn:aws:acm:*:*:certificate/*"
                  - "arn:aws:iam::*:role/*"
                  - "arn:aws:access-analyzer:*:*:analyzer/*"
                  - "arn:aws:acm-pca:*:*:certificate-authority/*"
                  - "arn:aws:cloudtrail:*:*:trail/*"
                  - "arn:aws:config:*:*:config-rule/*"
                  - "arn:aws:ds:*:*:directory/*"
                  - "arn:aws:fms:*:*:policy/*"
                  - "arn:aws:guardduty:*:*:detector/*"
                  - "arn:aws:network-firewall:*:*:firewall/*"
                  - "arn:aws:rolesanywhere:*:*:trust-anchor/*"
                  - "arn:aws:waf-regional:*:*:webacl/*"
                  - "arn:aws:waf::*:webacl/*"
                  - "arn:aws:wafv2:*:*:*/webacl/*"
                  - "arn:aws:shield::*:protection/*"
                  - "arn:aws:amplify:*:*:apps/*"
                  - "arn:aws:appsync:*:*:apis/*"
                  - "arn:aws:bedrock:*:*:guardrail/*"
                  - "arn:aws:codeartifact:*:*:domain/*"
                  - "arn:aws:codeartifact:*:*:repository/*"
                  - "arn:aws:codecommit:*:*:*"
                  - "arn:aws:codepipeline:*:*:*"
                  - "arn:aws:wellarchitected:*:*:workload/*"
                  - "arn:aws:athena:*:*:workgroup/*"
                  - "arn:aws:dms:*:*:rep:*"
                  - "arn:aws:datapipeline:*:*:pipeline/*"
                  - "arn:aws:datasync:*:*:task/*"
                  - "arn:aws:elasticmapreduce:*:*:cluster/*"
                  - "arn:aws:glacier:*:*:vaults/*"
                  - "arn:aws:memorydb:*:*:cluster/*"
                  - "arn:aws:mq:*:*:broker:*"
                  - "arn:aws:ses:*:*:identity/*"
                  - "arn:aws:ses:*:*:configuration-set/*"
                  - "arn:aws:storagegateway:*:*:gateway/*"
                  - "arn:aws:transfer:*:*:server/*"
                  - "arn:aws:appstream:*:*:fleet/*"
                  - "arn:aws:appstream:*:*:stack/*"
                  - "arn:aws:batch:*:*:compute-environment/*"
                  - "arn:aws:batch:*:*:job-queue/*"
                  - "arn:aws:directconnect:*:*:dxcon/*"
                  - "arn:aws:dlm:*:*:policy/*"
                  - "arn:aws:drs:*:*:source-server/*"
                  - "arn:aws:ssm:*:*:parameter/*"
                  - "arn:aws:ssm:*:*:document/*"
                  - "arn:aws:ssm-incidents::*:response-plan/*"
        - Fn::If:
            - CodeBuildTagging
            - PolicyName: TagctlApplyCodeBuild
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Sid: CodeBuildTagging
                    Effect: Allow
                    Action:
                      - codebuild:UpdateProject
                    Resource:
                      - "arn:aws:codebuild:*:*:project/*"
            - {Ref: AWS::NoValue}
        - Fn::If:
            - HasProtectedTagKeys
            - PolicyName: TagctlProtectedTagKeys
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Sid: DenyProtectedTagKeys
                    Effect: Deny
                    Action: "*"
                    Resource: "*"
                    Condition:
                      ForAnyValue:StringLike:
                        aws:TagKeys:
                          Fn::Split: [",", {Ref: ProtectedTagKeys}]
            - {Ref: AWS::NoValue}

Outputs:
  RoleArn:
    Description: Value for role_arn in tagctl.yaml (or --role).
    Value: {Fn::GetAtt: [Role, Arn]}
    Export:
      Name: {Fn::Sub: "${AWS::StackName}-RoleArn"}
  TagctlConfig:
    Description: Account entry for clouds.aws in tagctl.yaml.
    Value:
      Fn::Sub: "- profile: <base profile>\n  role_arn: ${Role.Arn}"
