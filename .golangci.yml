version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - goconst
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Print
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G104
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      ignore-rules:
        - unicrons
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - goconst
          - gocyclo
          - gosec
          - prealloc
        path: _test\.go
      - linters:
          - errorlint
        text: non-wrapping format verb
      - linters:
          - goconst
        path: internal/(engine/(scanner|planner|applier)|cli/plan)\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
